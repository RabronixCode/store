<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasa</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/kasa.css">
</head>
<body>
  <!--
    Ova stranica ide u folder kasa/ (van static), kao i vlasnik/ stranice.
    Servira je samo Python ruta, pa tamo staviš proveru role.
    Stil je u static/kasa.css, a skripta u static/kasa.js (adrese počinju sa /).

    Ugovor sa JavaScript-om (id i data-polje koje HTML očekuje):
      #pretraga               polje za pretragu
      #rezultati              lista predloga (ul), sakrivena dok ne treba
      #rezultat-sablon        šablon jednog predloga
                              (data-polje: sifra, naziv, stanje, jedinica_mere, cena)
      #nema-rezultata-sablon  šablon reda "Nema rezultata"
      #korpa-okvir            okvir tabele korpe, sakriven (hidden) dok je korpa prazna
      #korpa                  tbody u koji idu redovi korpe
      #stavka-korpe-sablon    šablon jednog reda korpe (tr)
                              (data-polje: sifra, naziv, stanje, jedinica_mere, cena, ukupno;
                               u redu su još: .manje, .vise i input[name="kolicina"])
      #prazna-korpa           tekst koji se vidi dok je korpa prazna
      #ukupno                 konačna cena (zbir cena puta količina)
      #kupi                   dugme KUPI (disabled dok je korpa prazna)
      #poruka                 uspeh ili greška
      #odjava                 dugme "Odjavi se"

    Stanja koja CSS očekuje od JS-a (klase i atributi):
      tr.stavka-korpe[aria-current="true"]   izabran red (bira se klikom, briše se tasterom Delete)
      .stanje.malo                           stanje je 0 ili manje (crveno)
  -->
  <main class="kasa">
    <nav>
      <a href="/pocetna.html">POCETNA</a>
      <a href="/kasa/kasa.html" aria-current="page">Kasa</a>
    </nav>

    <h1>Kasa</h1>

    <!--
      Pretraga je VAN forme, da Enter u njoj ne pošalje račun.
      JavaScript: pri fokusu prikaže prvih 50 artikala sortiranih po šifri, a lista
      pokazuje 5 redova odjednom (ostali se dobijaju skrolovanjem). Pri kucanju filtrira
      po šifri ili nazivu. Enter ili klik na predlog dodaje artikal u korpu.
      Za pristupačnost JS prebacuje: aria-expanded na polju (true/false),
      aria-selected="true" na izabranom predlogu i aria-activedescendant na polju.
    -->
    <div class="pretraga">
      <label for="pretraga">Šifra ili naziv artikla</label>
      <input id="pretraga" type="search" role="combobox"
             aria-controls="rezultati" aria-expanded="false" aria-autocomplete="list"
             autocomplete="off" placeholder="Počni da kucaš šifru ili naziv">
      <ul id="rezultati" class="rezultati" role="listbox" aria-label="Predlozi artikala" hidden></ul>
    </div>

    <!--
      Korpa je u formi, a dugme KUPI je submit.
      Pažnja: Enter u polju za količinu takođe šalje formu (podrazumevano ponašanje pregledača),
      što bi moglo da kupi slučajno. Zato u JS-u za polja količine spreči Enter (preventDefault).
    -->
    <form id="forma-kasa">
      <h2>Korpa</h2>

      <p id="prazna-korpa" class="prazno">Korpa je prazna. Pronađi artikal pretragom iznad.</p>

      <div id="korpa-okvir" class="korpa-okvir" hidden>
        <table class="korpa-tabela">
          <caption class="samo-citac">Artikli u korpi</caption>
          <thead>
            <tr>
              <th scope="col" class="sifra">Šifra</th>
              <th scope="col">Naziv</th>
              <th scope="col" class="desno">Stanje</th>
              <th scope="col" class="desno">Cena</th>
              <th scope="col" class="sredina">Količina</th>
              <th scope="col" class="desno">Ukupno</th>
            </tr>
          </thead>
          <tbody id="korpa"></tbody>
        </table>
        <p class="pomoc">Klikni red da ga izabereš, pa pritisni Delete da ga obrišeš.</p>
      </div>

      <div class="zbir">
        <span>KONAČNA CENA</span>
        <!-- Valuta je pretpostavka (RSD), promeni ako treba -->
        <span class="iznos"><output id="ukupno" for="korpa">0,00</output> RSD</span>
      </div>

      <button type="submit" id="kupi" disabled>KUPI</button>
    </form>

    <p id="poruka" role="status"></p>

    <!-- Isto dugme kao na početnoj. Klik obrađuje JS. -->
    <button id="odjava" class="sekundarno" type="button">Odjavi se</button>
  </main>

  <!-- Šablon jednog predloga u listi. JS postavlja i id (npr. "rezultat-123") zbog aria-activedescendant. -->
  <template id="rezultat-sablon">
    <li class="rezultat" role="option" aria-selected="false">
      <span class="sifra" data-polje="sifra"></span>
      <span class="naziv" data-polje="naziv"></span>
      <span class="stanje"><span data-polje="stanje"></span> <span data-polje="jedinica_mere"></span></span>
      <span class="cena" data-polje="cena"></span>
    </li>
  </template>

  <template id="nema-rezultata-sablon">
    <li class="nema-rezultata" role="presentation">Nema rezultata</li>
  </template>

  <!--
    Šablon jednog reda korpe. Ceo red se bira klikom (tabindex="0" da bi se mogao izabrati
    i tastaturom). Količina se menja dugmadima - i + (za 1) ili upisom broja u polje.
    data-oznaka se koristi samo na uskom ekranu, gde red postaje kartica.
  -->
  <template id="stavka-korpe-sablon">
    <tr class="stavka-korpe" tabindex="0">
      <td class="sifra" data-oznaka="Šifra" data-polje="sifra"></td>
      <td class="naziv" data-polje="naziv"></td>
      <td class="stanje desno" data-oznaka="Stanje"><span data-polje="stanje"></span> <span data-polje="jedinica_mere"></span></td>
      <td class="cena desno" data-oznaka="Cena" data-polje="cena"></td>
      <td class="kolicina sredina">
        <div class="kolicina-kontrola">
          <button type="button" class="manje" aria-label="Smanji količinu za 1">&minus;</button>
          <input name="kolicina" type="number" min="0" step="any" value="1"
                 inputmode="decimal" required aria-label="Količina">
          <button type="button" class="vise" aria-label="Povećaj količinu za 1">+</button>
        </div>
      </td>
      <td class="ukupno desno" data-oznaka="Ukupno"><output data-polje="ukupno"></output></td>
    </tr>
  </template>

  <script src="/kasa.js"></script>
</body>
</html>
