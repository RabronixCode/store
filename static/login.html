<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prijava</title>
  <link rel="stylesheet" href="/tema.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <script src="/zaglavlje.js"></script>
  <main class="uzak">
    <header class="prijava-naslov">
      <span class="prijava-logo"><svg class="ikona-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l2-5h14l2 5M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></svg></span>
      <h1>Prijava</h1>
      <p>Upiši korisničko ime i lozinku.</p>
    </header>

    <!-- method="post" je zaštita: kad JavaScript ne bi radio, lozinka ne bi završila u adresi (GET).
         Slanje na server radi login.js (fetch), a ne ovaj atribut. -->
    <form id="forma-login" method="post">
      <label>Korisničko ime
        <input id="username" name="username" type="text" required maxlength="100"
               autocomplete="username" autocapitalize="none" spellcheck="false">
      </label>

      <label>Lozinka
        <input id="password" name="password" type="password" required maxlength="200"
               autocomplete="current-password">
      </label>

      <button type="submit">Prijavi se</button>
    </form>

    <!-- Ovde će kod iz login.js ispisivati grešku (klasa "greska") ili uspeh (klasa "uspeh") -->
    <p id="poruka" role="status"></p>
  </main>

  <script src="login.js"></script>
</body>
</html>
